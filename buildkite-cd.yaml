agents:
  queue: private

steps:
  - label: build
    artifacts:
      - alejandra-*
    command:
      - echo +++
      - nix build .#alejandra-binaries
      - nix-store
        --query
        --include-outputs $(nix-store --query --deriver result)
        --requisites |
        grep -v '\.drv$$' |
        cachix push alejandra
      - cp -L result/* .

  - label: coverage
    command:
      - echo +++ Fetch
      - git branch -D main
      - git branch main
      - git checkout main
      - echo --- Load environment
      - direnv allow
      - eval "$(direnv export bash)"
      - echo +++ Run tests
      - cargo tarpaulin --workspace --coveralls "$${COVERALLS_REPO_TOKEN}"

  - label: nixpkgs idempotence and meaning (full tree)
    command:
      - echo --- Cloning nixpkgs
      - git config --global --add safe.directory /data/nixpkgs/.git
      - git clone --branch=master --depth 1 --origin=upstream file:///data/nixpkgs

      - echo --- Building alejandra
      - nix build --out-link alejandra-result .

      - echo +++ Check all of nixpkgs
      - scripts/check-nixpkgs.sh
        --formatter alejandra-result/bin/alejandra
        --nixpkgs nixpkgs
