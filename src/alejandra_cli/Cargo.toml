[[bin]]
name = "alejandra"
path = "src/main.rs"

[dependencies]
alejandra = { path = "../alejandra" }
clap = { version = "3.2.25", default-features = false, features = [
  "color",
  "derive",
  "env",
  "std",
  "strsim",
] }
futures = { version = "0.3.32", default-features = false, features = [
  "executor",
  "thread-pool",
] }
ignore = { version = "0.4.25", default-features = false, features = [] }
num_cpus = { version = "1.17.0", default-features = false, features = [] }
rand = { version = "0.8.6", default-features = false, features = [
  "alloc",
  "getrandom",
] }
toml = { version = "1.1.0", default-features = false, features = ["parse", "serde"] }

[package]
authors = ["Kevin Amado <kamadorueda@gmail.com>"]
description = "The Uncompromising Nix Code Formatter"
edition = "2021"
license = "Unlicense"
name = "alejandra_cli"
repository = "https://github.com/kamadorueda/alejandra"
rust-version = "1.85"
version = "4.1.0"

[dev-dependencies]
pretty_assertions = "1.3.0"
